# Global settings
# See https://docs.armbian.com/Developer-Guide_Build-Switches/

# Whitelabeling
VENDOR="pyGameOS"
VENDORURL="https://github.com/spudgunman/pyGameOS/"
VENDORSUPPORT="https://github.com/spudgunman/pyGameOS/issues"
VENDORBUGS="https://github.com/spudgunman/pyGameOS/issues"
VENDORDOCS="https://github.com/spudgunman/pyGameOS/wiki"

# Release settings
RELEASE=trixie
DOCKER_ARMBIAN_BASE_IMAGE="ubuntu:noble"
INSTALL_HEADERS=yes
INSTALL_ARMBIAN_FIRMWARE=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
BUILD_MINIMAL=yes
DEB_COMPRESS=xz
NETWORKING_STACK="network-manager"
EXTRAWIFI=yes
COMPRESS_OUTPUTIMAGE="xz,sha"
ENABLE_EXTENSIONS=""